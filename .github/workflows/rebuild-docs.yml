name: Rebuild on Docs Update

# Re-pins @mcp-hangar/docs to the latest docs commit so a Vercel rebuild ships
# current docs.
#
# The pin lives in packages/site/package.json as an explicit commit SHA, not as
# `#main`. That is deliberate on both counts. It says which docs commit the site
# is built against somewhere a person can read it, rather than hiding it in a
# lockfile entry -- and it is what makes this job work at all, because pnpm
# re-resolves a github: dependency when its specifier changes and not otherwise.
#
# This runs as a PULL REQUEST, not a direct push. `main` is protected (PRs
# required, `build-and-test` must pass), so the old `git push` to main was
# rejected every night with GH006 -- the bump ran, produced a changed lockfile,
# and then could not land it, which is how the site served docs eight commits
# stale. Opening a PR lets the required check run and the change land the only
# way main accepts changes. Uses the release-bot app token when configured so
# the PR's checks trigger (a GITHUB_TOKEN-authored PR does not trigger them).
#
# Trigger from the main mcp-hangar repo on docs changes:
#
#   - name: Trigger website rebuild
#     uses: peter-evans/repository-dispatch@v2
#     with:
#       token: ${{ secrets.WEBSITE_REPO_TOKEN }}
#       repository: mapyr/mcp-hangar-website
#       event-type: docs-updated

on:
  repository_dispatch:
    types: [docs-updated]

  # Daily catch-up for docs changes
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch: {}

concurrency:
  group: update-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # If an App-token secret is configured, open the PR with it so its checks run;
  # otherwise fall back to GITHUB_TOKEN (the PR still opens, for a human to merge).
  RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}

jobs:
  bump-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing here touches pnpm-lock.yaml by hand. The previous version of
      # this step deleted the resolved entry with two regexes and trusted
      # `pnpm install --lockfile-only` to put it back; under pnpm 11 that
      # command answers "Already up to date" and writes nothing, even with
      # --force, so every run produced a lockfile missing a dependency that
      # package.json still declared. CI then failed the PR with
      # ERR_PNPM_OUTDATED_LOCKFILE, which is how #228 sat broken.
      #
      # Moving the specifier is what makes pnpm resolve. So the specifier is
      # what moves.
      - name: Bump @mcp-hangar/docs to latest commit
        run: |
          set -euo pipefail
          latest=$(git ls-remote https://github.com/mcp-hangar/docs.git main | cut -f1)
          [ -n "$latest" ] || { echo "could not read docs main"; exit 1; }

          current=$(node -p "require('./packages/site/package.json').dependencies['@mcp-hangar/docs']")
          echo "current: $current"
          echo "latest:  github:mcp-hangar/docs#$latest"

          if [ "$current" = "github:mcp-hangar/docs#$latest" ]; then
            echo "Docs pin is already current."
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const file = 'packages/site/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.dependencies['@mcp-hangar/docs'] = 'github:mcp-hangar/docs#' + process.argv[1];
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          " "$latest"

          pnpm install --lockfile-only
          grep -m1 -A2 "'@mcp-hangar/docs':" pnpm-lock.yaml

      - name: Open PR if the docs pin moved
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/rebuild-docs-pin
          delete-branch: true
          add-paths: |
            pnpm-lock.yaml
            packages/site/package.json
          commit-message: "chore(site): bump docs pin to latest"
          title: "chore(site): bump docs pin to latest"
          body: |
            Automated by `rebuild-docs` -- re-pins `@mcp-hangar/docs` to the latest docs
            `main` so the deployed site serves current documentation. The pin is the
            commit SHA in `packages/site/package.json`; `pnpm-lock.yaml` follows it.

            Merging this triggers a Vercel rebuild with the new docs. If the pin was
            already current, nothing changes and no PR is opened.
