# Thin caller -- logic lives in mcp-hangar/.github (reusable).
name: branch-name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# See the note in pr-title.yml on why `pull-requests: read` is required here.
permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    uses: mcp-hangar/.github/.github/workflows/branch-name.yml@10a1c6b7ee1018f5e58abd85436fe44a035ac08e # main
