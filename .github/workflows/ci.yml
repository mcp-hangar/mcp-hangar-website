name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for smoke tests
        run: pnpm --filter site exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: packages/site/dist/
          retention-days: 7
          if-no-files-found: error

  # The site publishes Kubernetes manifests as copyable examples, and until
  # 2026-09-09 nothing checked them: both homepage MCPEgressPolicy snippets had
  # drifted into something `kubectl apply` rejects, while every manifest in the
  # docs repo stayed correct -- because that repo has had this gate for months
  # and this one had no gate of the class at all.
  #
  # The checker lives in the docs repo beside its siblings rather than being
  # copied here, and the CRD schema is read from the operator repository. A
  # copied schema drifts, and a drifted schema approves the wrong thing.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: site
          persist-credentials: false

      - name: Checkout docs (the checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcp-hangar/docs
          path: docs
          persist-credentials: false

      - name: Checkout operator (the CRD schema)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcp-hangar/mcp-hangar-operator
          path: operator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Check the site's manifests against the operator CRDs
        run: |
          pip install --quiet pyyaml
          python docs/scripts/check_manifests.py \
            --docs site/packages/site/src \
            --ext astro,mdx,ts \
            --operator operator
