# Thin caller -- logic lives in mcp-hangar/.github (reusable).
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# See the note in pr-title.yml on why `pull-requests: read` is required here.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    uses: mcp-hangar/.github/.github/workflows/pr-body.yml@2ca382cad799aba046b435917ae322cb770db373 # main
