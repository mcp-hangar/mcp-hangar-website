# Dependabot version-updates. pnpm workspace: the root manifest + lockfile
# covers all workspace packages, so a separate /packages/site npm entry only
# produced duplicate PRs (see #79/#81) and was removed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint refuses to run on TS 7 ("typescript-eslint does not
      # support TS 7.0"), so every TypeScript major opens a PR that cannot pass
      # `pnpm verify` and cannot be fixed here. Lift this once typescript-eslint
      # ships TS 7 support -- and remember it also hides TS 8 while it stands.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types:
          - minor
          - patch
